<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autonomous Cloud FinOps Agent — Closed-Loop Remediation</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            },
            dark: {
              bg: '#0a0f1d',
              card: '#111827',
              border: '#1f2937',
              accent: '#1e293b'
            }
          }
        }
      }
    }
  </script>
  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #111827; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
  </style>
</head>
<body class="custom-scroll min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState("overview");
      const [metrics, setMetrics] = useState({
        total_cloud_cost: 0,
        potential_monthly_savings: 0,
        resources_analyzed: 0,
        optimization_opportunities: 0,
        pending_approvals: 0,
        successful_validations: 0,
        average_cpu_utilization: 0,
        average_memory_utilization: 0
      });
      const [resources, setResources] = useState([]);
      const [proposals, setProposals] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]);
      const [loading, setLoading] = useState(false);
      const [selectedProposal, setSelectedProposal] = useState(null);
      const [selectedTf, setSelectedTf] = useState(null);
      const [selectedSafety, setSelectedSafety] = useState(null);
      const [selectedSim, setSelectedSim] = useState(null);
      const [actionMessage, setActionMessage] = useState("");

      const fetchData = async () => {
        try {
          const [mRes, rRes, pRes, aRes] = await Promise.all([
            fetch("/api/overview").then(res => res.json()),
            fetch("/api/resources").then(res => res.json()),
            fetch("/api/optimizations").then(res => res.json()),
            fetch("/api/audit-logs").then(res => res.json())
          ]);
          setMetrics(mRes);
          setResources(rRes);
          setProposals(pRes);
          setAuditLogs(aRes);
          if (pRes.length > 0 && !selectedProposal) {
            setSelectedProposal(pRes[0]);
            loadProposalDetails(pRes[0].proposal_id);
          }
        } catch (err) {
          console.error("Data fetch failed:", err);
        }
      };

      useEffect(() => {
        fetchData();
        const interval = setInterval(fetchData, 8000);
        return () => clearInterval(interval);
      }, []);

      const loadProposalDetails = async (proposalId) => {
        try {
          const [tfRes, sfRes] = await Promise.all([
            fetch(`/api/optimizations/${proposalId}/terraform`).then(r => r.ok ? r.json() : null),
            fetch(`/api/optimizations/${proposalId}/safety`).then(r => r.ok ? r.json() : null)
          ]);
          setSelectedTf(tfRes && tfRes.length > 0 ? tfRes[0] : null);
          setSelectedSafety(sfRes);
        } catch (e) {
          console.error(e);
        }
      };

      const handleRunAnalysis = async () => {
        setLoading(true);
        setActionMessage("Orchestrating autonomous multi-agent analysis loop...");
        try {
          const res = await fetch("/api/analysis/run", { method: "POST" });
          const data = await res.json();
          setActionMessage(`Analysis complete! Identified ${data.proposals_generated} optimization proposals.`);
          await fetchData();
        } catch (e) {
          setActionMessage("Analysis failed to complete.");
        } finally {
          setLoading(false);
          setTimeout(() => setActionMessage(""), 5000);
        }
      };

      const handleApprove = async (proposalId) => {
        try {
          await fetch(`/api/optimizations/${proposalId}/approve`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ approver: "PrincipalFinOpsEngineer", reason: "Approved via Web UI Console" })
          });
          setActionMessage(`Proposal ${proposalId} APPROVED successfully!`);
          await fetchData();
        } catch (e) {
          alert("Approval failed: " + e.message);
        }
      };

      const handleReject = async (proposalId) => {
        try {
          await fetch(`/api/optimizations/${proposalId}/reject`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ approver: "PrincipalFinOpsEngineer", reason: "Rejected via Web UI Console" })
          });
          setActionMessage(`Proposal ${proposalId} REJECTED.`);
          await fetchData();
        } catch (e) {
          alert("Rejection failed: " + e.message);
        }
      };

      const handleSimulate = async (proposalId) => {
        setLoading(true);
        try {
          const res = await fetch(`/api/optimizations/${proposalId}/simulate`, { method: "POST" });
          const data = await res.json();
          if (!res.ok) {
            alert(`Simulation blocked: ${data.detail}`);
          } else {
            setSelectedSim(data);
            setActionMessage(`Dry-run simulation executed and verified for ${proposalId}!`);
            await fetchData();
          }
        } catch (e) {
          alert("Simulation call error: " + e.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="flex h-screen overflow-hidden bg-[#0a0f1d]">
          {/* Sidebar */}
          <aside className="w-64 bg-[#0d1424] border-r border-gray-800 flex flex-col justify-between">
            <div>
              <div className="p-5 border-b border-gray-800 flex items-center space-x-3">
                <div className="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/30">
                  ⚡
                </div>
                <div>
                  <h1 className="font-semibold text-sm tracking-wide text-white">FinOps Agent</h1>
                  <span className="text-xs text-blue-400 font-mono">Autonomous v1.0</span>
                </div>
              </div>

              <nav className="p-3 space-y-1 text-sm font-medium">
                {[
                  { id: "overview", label: "Overview", icon: "📊" },
                  { id: "resources", label: "Cloud Resources", icon: "☁️" },
                  { id: "proposals", label: "AI Recommendations", icon: "💡" },
                  { id: "workflow", label: "Agent Workflow", icon: "🔄" },
                  { id: "terraform", label: "Terraform IaC", icon: "🛠️" },
                  { id: "safety", label: "Safety Critic", icon: "🛡️" },
                  { id: "approvals", label: "Approval Center", icon: "✍️" },
                  { id: "simulation", label: "Dry-Run Simulation", icon: "🧪" },
                  { id: "audit", label: "Audit Logs", icon: "📜" },
                  { id: "benchmarks", label: "Evaluation Benchmarks", icon: "📈" }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg transition-all ${
                      activeTab === item.id 
                        ? "bg-blue-600/20 text-blue-400 border border-blue-500/30 font-semibold" 
                        : "text-gray-400 hover:bg-gray-800/60 hover:text-gray-200"
                    }`}
                  >
                    <span>{item.icon}</span>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            <div className="p-4 border-t border-gray-800 text-xs text-gray-500">
              <div className="flex items-center space-x-2">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>LangGraph & FastAPI Active</span>
              </div>
              <div className="mt-1 font-mono text-[11px] text-gray-400">Sandbox: Dry-Run Only</div>
            </div>
          </aside>

          {/* Main Content Area */}
          <main className="flex-1 flex flex-col overflow-y-auto custom-scroll">
            {/* Topbar */}
            <header className="h-16 bg-[#0d1424]/90 backdrop-blur border-b border-gray-800 flex items-center justify-between px-6 sticky top-0 z-20">
              <div className="flex items-center space-x-4">
                <h2 className="text-lg font-semibold text-white capitalize">{activeTab.replace('-', ' ')}</h2>
                {actionMessage && (
                  <span className="text-xs bg-blue-900/50 text-blue-300 border border-blue-600/40 px-3 py-1 rounded-full animate-fade-in">
                    {actionMessage}
                  </span>
                )}
              </div>
              <div className="flex items-center space-x-3">
                <button
                  onClick={handleRunAnalysis}
                  disabled={loading}
                  className="bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-lg shadow-blue-600/20 flex items-center space-x-2 transition"
                >
                  <span>{loading ? "⏳" : "▶️"}</span>
                  <span>{loading ? "Analyzing Pipeline..." : "Run Autonomous Analysis"}</span>
                </button>
              </div>
            </header>

            {/* Main Tab Panels */}
            <div className="p-6 space-y-6">

              {/* OVERVIEW METRICS CARDS */}
              <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                <div className="bg-[#111827] border border-gray-800 p-4 rounded-xl">
                  <div className="text-xs text-gray-400">Total Cloud Cost</div>
                  <div className="text-xl font-bold text-white mt-1">${metrics.total_cloud_cost.toLocaleString()}</div>
                  <div className="text-[11px] text-gray-500 mt-1">Monthly Run-rate</div>
                </div>
                <div className="bg-[#111827] border border-blue-900/40 p-4 rounded-xl relative overflow-hidden">
                  <div className="text-xs text-blue-400 font-medium">Potential Savings</div>
                  <div className="text-xl font-bold text-emerald-400 mt-1">${metrics.potential_monthly_savings.toLocaleString()}</div>
                  <div className="text-[11px] text-emerald-500/80 mt-1 font-mono">
                    {metrics.total_cloud_cost > 0 ? Math.round((metrics.potential_monthly_savings / metrics.total_cloud_cost) * 100) : 0}% Waste Reduction
                  </div>
                </div>
                <div className="bg-[#111827] border border-gray-800 p-4 rounded-xl">
                  <div className="text-xs text-gray-400">Resources Analyzed</div>
                  <div className="text-xl font-bold text-white mt-1">{metrics.resources_analyzed}</div>
                  <div className="text-[11px] text-gray-500 mt-1">EC2, EBS, RDS, S3</div>
                </div>
                <div className="bg-[#111827] border border-gray-800 p-4 rounded-xl">
                  <div className="text-xs text-gray-400">Opportunities</div>
                  <div className="text-xl font-bold text-amber-400 mt-1">{metrics.optimization_opportunities}</div>
                  <div className="text-[11px] text-gray-500 mt-1">Actionable Proposals</div>
                </div>
                <div className="bg-[#111827] border border-gray-800 p-4 rounded-xl">
                  <div className="text-xs text-gray-400">Pending Approvals</div>
                  <div className="text-xl font-bold text-purple-400 mt-1">{metrics.pending_approvals}</div>
                  <div className="text-[11px] text-gray-500 mt-1">Human-in-the-Loop</div>
                </div>
                <div className="bg-[#111827] border border-gray-800 p-4 rounded-xl">
                  <div className="text-xs text-gray-400">Validations Passed</div>
                  <div className="text-xl font-bold text-emerald-400 mt-1">{metrics.successful_validations}</div>
                  <div className="text-[11px] text-gray-500 mt-1">IaC Schema Validated</div>
                </div>
              </div>

              {/* TAB: OVERVIEW */}
              {activeTab === "overview" && (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="lg:col-span-2 bg-[#111827] border border-gray-800 rounded-xl p-5">
                    <h3 className="text-sm font-semibold text-white mb-4 flex items-center justify-between">
                      <span>Resource Fleet & Utilization Summary</span>
                      <span className="text-xs text-blue-400 font-mono">Avg CPU: {metrics.average_cpu_utilization}% | Avg RAM: {metrics.average_memory_utilization}%</span>
                    </h3>
                    <div className="space-y-4">
                      {resources.map(r => (
                        <div key={r.resource_id} className="p-3 bg-[#0d1424] rounded-lg border border-gray-800/80 flex items-center justify-between">
                          <div>
                            <div className="flex items-center space-x-2">
                              <span className="text-xs font-bold text-blue-400 px-2 py-0.5 bg-blue-950/60 rounded border border-blue-800/40">{r.resource_type}</span>
                              <span className="text-sm font-medium text-white">{r.resource_name}</span>
                              <span className="text-xs text-gray-400 font-mono">({r.resource_id})</span>
                            </div>
                            <div className="text-xs text-gray-400 mt-1 flex space-x-4">
                              <span>Env: <b className="text-gray-300">{r.environment}</b></span>
                              <span>Config: <b className="text-gray-300">{r.instance_type}</b></span>
                              {r.cpu_utilization > 0 && <span>CPU: <b className="text-amber-400">{r.cpu_utilization}%</b></span>}
                            </div>
                          </div>
                          <div className="text-right">
                            <div className="text-sm font-bold text-white">${r.monthly_cost.toFixed(2)}/mo</div>
                            <span className={`text-[10px] px-2 py-0.5 rounded font-semibold uppercase ${
                              r.criticality === 'critical' ? 'bg-red-950 text-red-400 border border-red-800' : 'bg-gray-800 text-gray-300'
                            }`}>
                              {r.criticality}
                            </span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="bg-[#111827] border border-gray-800 rounded-xl p-5 space-y-4">
                    <h3 className="text-sm font-semibold text-white">Closed-Loop Architecture Status</h3>
                    <div className="space-y-3 text-xs">
                      <div className="p-3 bg-[#0d1424] rounded-lg border border-gray-800">
                        <div className="font-semibold text-blue-400">1. Metrics & Deterministic Rules</div>
                        <p className="text-gray-400 mt-1">Calculates utilization baselines without relying on LLM hallucination for mathematics.</p>
                      </div>
                      <div className="p-3 bg-[#0d1424] rounded-lg border border-gray-800">
                        <div className="font-semibold text-blue-400">2. Gemini Analyst Agent</div>
                        <p className="text-gray-400 mt-1">Evaluates contextual trade-offs and generates structured Pydantic proposals.</p>
                      </div>
                      <div className="p-3 bg-[#0d1424] rounded-lg border border-gray-800">
                        <div className="font-semibold text-blue-400">3. Terraform IaC & Validation</div>
                        <p className="text-gray-400 mt-1">Generates allowlisted HCL templates and validates via syntax engine.</p>
                      </div>
                      <div className="p-3 bg-[#0d1424] rounded-lg border border-gray-800">
                        <div className="font-semibold text-blue-400">4. Independent Safety Critic</div>
                        <p className="text-gray-400 mt-1">Guards against production deletions, CAB requirements, and privilege escalations.</p>
                      </div>
                      <div className="p-3 bg-[#0d1424] rounded-lg border border-gray-800">
                        <div className="font-semibold text-blue-400">5. Server-Enforced Human Approval</div>
                        <p className="text-gray-400 mt-1">No execution can occur without verified server-side approval state.</p>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB: CLOUD RESOURCES */}
              {activeTab === "resources" && (
                <div className="bg-[#111827] border border-gray-800 rounded-xl overflow-hidden">
                  <div className="p-4 border-b border-gray-800 flex justify-between items-center">
                    <h3 className="text-sm font-semibold text-white">Cloud Inventory Telemetry</h3>
                    <button 
                      onClick={() => fetch("/api/resources/seed?force_reload=true", {method: "POST"}).then(() => fetchData())}
                      className="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded border border-gray-700"
                    >
                      Reset Synthetic Data
                    </button>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs text-gray-300">
                      <thead className="bg-[#0d1424] text-gray-400 uppercase font-semibold text-[10px] border-b border-gray-800">
                        <tr>
                          <th className="p-3">Resource ID</th>
                          <th className="p-3">Name</th>
                          <th className="p-3">Type</th>
                          <th className="p-3">Configuration</th>
                          <th className="p-3">CPU / RAM</th>
                          <th className="p-3">Region / Env</th>
                          <th className="p-3">Monthly Cost</th>
                          <th className="p-3">Criticality</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-800">
                        {resources.map(r => (
                          <tr key={r.resource_id} className="hover:bg-gray-800/40">
                            <td className="p-3 font-mono text-blue-400">{r.resource_id}</td>
                            <td className="p-3 font-medium text-white">{r.resource_name}</td>
                            <td className="p-3">
                              <span className="px-2 py-0.5 rounded bg-gray-800 border border-gray-700 font-mono text-[10px]">{r.resource_type}</span>
                            </td>
                            <td className="p-3">{r.instance_type}</td>
                            <td className="p-3">
                              {r.cpu_utilization > 0 ? `${r.cpu_utilization}% / ${r.memory_utilization}%` : "N/A"}
                            </td>
                            <td className="p-3">{r.region} / <span className="text-gray-400">{r.environment}</span></td>
                            <td className="p-3 font-bold text-white">${r.monthly_cost.toFixed(2)}</td>
                            <td className="p-3">
                              <span className={`px-2 py-0.5 rounded font-semibold text-[10px] uppercase ${
                                r.criticality === 'critical' ? 'bg-red-950 text-red-400' : 'bg-gray-800 text-gray-300'
                              }`}>
                                {r.criticality}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* TAB: AI RECOMMENDATIONS */}
              {activeTab === "proposals" && (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="space-y-4">
                    <h3 className="text-sm font-semibold text-white">Generated Proposals ({proposals.length})</h3>
                    {proposals.map(p => (
                      <div
                        key={p.proposal_id}
                        onClick={() => { setSelectedProposal(p); loadProposalDetails(p.proposal_id); }}
                        className={`p-4 rounded-xl border cursor-pointer transition ${
                          selectedProposal?.proposal_id === p.proposal_id
                            ? "bg-blue-950/30 border-blue-500 shadow-md shadow-blue-500/10"
                            : "bg-[#111827] border-gray-800 hover:border-gray-700"
                        }`}
                      >
                        <div className="flex justify-between items-start">
                          <span className="text-xs font-mono text-blue-400">{p.proposal_id}</span>
                          <span className={`text-[10px] px-2 py-0.5 rounded font-bold uppercase ${
                            p.status === 'APPROVED' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' :
                            p.status === 'REJECTED' ? 'bg-red-950 text-red-400 border border-red-800' :
                            p.status === 'BLOCKED' ? 'bg-rose-950 text-rose-400 border border-rose-800' :
                            p.status === 'EXECUTED' ? 'bg-purple-950 text-purple-400 border border-purple-800' :
                            'bg-amber-950 text-amber-400 border border-amber-800'
                          }`}>
                            {p.status}
                          </span>
                        </div>
                        <h4 className="text-sm font-semibold text-white mt-2">{p.issue}</h4>
                        <div className="mt-3 flex justify-between items-center text-xs">
                          <span className="text-gray-400">Savings: <b className="text-emerald-400 font-bold">${p.estimated_saving.toFixed(2)}/mo</b></span>
                          <span className="text-gray-500 font-mono text-[11px]">{p.source}</span>
                        </div>
                      </div>
                    ))}
                  </div>

                  {selectedProposal && (
                    <div className="lg:col-span-2 bg-[#111827] border border-gray-800 rounded-xl p-6 space-y-6">
                      <div className="flex justify-between items-start border-b border-gray-800 pb-4">
                        <div>
                          <div className="text-xs font-mono text-gray-400">{selectedProposal.proposal_id}</div>
                          <h3 className="text-lg font-bold text-white mt-1">{selectedProposal.issue}</h3>
                          <div className="text-xs text-gray-400 mt-1">Target Resource: <span className="font-mono text-blue-400">{selectedProposal.resource_id}</span></div>
                        </div>
                        <div className="flex space-x-2">
                          {selectedProposal.status === "PENDING" && (
                            <>
                              <button
                                onClick={() => handleApprove(selectedProposal.proposal_id)}
                                className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2 rounded-lg"
                              >
                                Approve Proposal
                              </button>
                              <button
                                onClick={() => handleReject(selectedProposal.proposal_id)}
                                className="bg-red-600 hover:bg-red-500 text-white text-xs font-semibold px-4 py-2 rounded-lg"
                              >
                                Reject
                              </button>
                            </>
                          )}
                          {selectedProposal.status === "APPROVED" && (
                            <button
                              onClick={() => handleSimulate(selectedProposal.proposal_id)}
                              className="bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-lg shadow-purple-600/20"
                            >
                              Run Dry-Run Simulation
                            </button>
                          )}
                        </div>
                      </div>

                      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div className="p-3 bg-[#0d1424] rounded-lg border border-gray-800">
                          <div className="text-[11px] text-gray-400">Current Config</div>
                          <div className="text-sm font-semibold text-white mt-1">{selectedProposal.current_configuration}</div>
                        </div>
                        <div className="p-3 bg-[#0d1424] rounded-lg border border-gray-800">
                          <div className="text-[11px] text-gray-400">Recommended Config</div>
                          <div className="text-sm font-semibold text-blue-400 mt-1">{selectedProposal.recommended_configuration}</div>
                        </div>
                        <div className="p-3 bg-[#0d1424] rounded-lg border border-gray-800">
                          <div className="text-[11px] text-gray-400">Monthly Savings</div>
                          <div className="text-sm font-bold text-emerald-400 mt-1">${selectedProposal.estimated_saving.toFixed(2)}</div>
                        </div>
                        <div className="p-3 bg-[#0d1424] rounded-lg border border-gray-800">
                          <div className="text-[11px] text-gray-400">Risk Assessment</div>
                          <div className="text-sm font-bold text-amber-400 mt-1">{selectedProposal.risk}</div>
                        </div>
                      </div>

                      <div>
                        <h4 className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Metrics Evidence</h4>
                        <p className="text-sm text-gray-200 bg-[#0d1424] p-3 rounded-lg border border-gray-800 mt-1 font-mono text-xs">{selectedProposal.evidence}</p>
                      </div>

                      <div>
                        <h4 className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Reasoning & Architectural Justification</h4>
                        <p className="text-sm text-gray-300 mt-1">{selectedProposal.reasoning}</p>
                      </div>

                      {selectedTf && (
                        <div>
                          <h4 className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Generated Terraform Configuration</h4>
                          <pre className="bg-[#0d1424] p-4 rounded-lg border border-gray-800 text-xs font-mono text-emerald-300 overflow-x-auto">
                            {selectedTf.code}
                          </pre>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}

              {/* TAB: AGENT WORKFLOW */}
              {activeTab === "workflow" && (
                <div className="bg-[#111827] border border-gray-800 rounded-xl p-6 space-y-6">
                  <h3 className="text-base font-bold text-white">LangGraph Multi-Agent Orchestration Workflow</h3>
                  <p className="text-xs text-gray-400">
                    Visualizing the closed-loop state transitions, bounded self-correction loops, and safety checkpoints.
                  </p>

                  <div className="grid grid-cols-1 md:grid-cols-5 gap-4 mt-4">
                    {[
                      { step: "1", title: "Metrics Analyst", desc: "Deterministic utilization & cost calculations", status: "Active" },
                      { step: "2", title: "Analyst Agent", desc: "Gemini LLM / Fallback structured proposal", status: "Active" },
                      { step: "3", title: "Terraform IaC", desc: "Allowlisted template generation", status: "Active" },
                      { step: "4", title: "Validator & Fix", desc: "Bounded self-correction (max 3 retries)", status: "Active" },
                      { step: "5", title: "Safety Critic", desc: "Independent production safeguards", status: "Active" }
                    ].map(node => (
                      <div key={node.step} className="p-4 bg-[#0d1424] border border-blue-900/40 rounded-xl relative">
                        <div className="w-6 h-6 rounded-full bg-blue-600 text-white font-bold text-xs flex items-center justify-center mb-2">
                          {node.step}
                        </div>
                        <h4 className="text-sm font-semibold text-white">{node.title}</h4>
                        <p className="text-xs text-gray-400 mt-1">{node.desc}</p>
                      </div>
                    ))}
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mt-2">
                    {[
                      { step: "6", title: "Human Approval Gate", desc: "Server-enforced approval checkpoint", status: "Mandatory" },
                      { step: "7", title: "Dry-Run Simulator", desc: "Safe AWS-isolated API simulation", status: "Zero-Mutation" },
                      { step: "8", title: "Post-Verification", desc: "State diff and drift verification", status: "Enforced" },
                      { step: "9", title: "Audit Trail", desc: "Database persisted event ledger", status: "Logged" }
                    ].map(node => (
                      <div key={node.step} className="p-4 bg-[#0d1424] border border-emerald-900/40 rounded-xl relative">
                        <div className="w-6 h-6 rounded-full bg-emerald-600 text-white font-bold text-xs flex items-center justify-center mb-2">
                          {node.step}
                        </div>
                        <h4 className="text-sm font-semibold text-white">{node.title}</h4>
                        <p className="text-xs text-gray-400 mt-1">{node.desc}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB: TERRAFORM IAC */}
              {activeTab === "terraform" && (
                <div className="bg-[#111827] border border-gray-800 rounded-xl p-6 space-y-4">
                  <h3 className="text-sm font-semibold text-white">Terraform Infrastructure-as-Code Repository</h3>
                  <div className="text-xs text-gray-400">
                    Safe allowlisted declarations generated for pending and approved proposals.
                  </div>
                  {selectedTf ? (
                    <pre className="bg-[#0d1424] p-5 rounded-xl border border-gray-800 text-xs font-mono text-emerald-300 overflow-x-auto leading-relaxed">
                      {selectedTf.code}
                    </pre>
                  ) : (
                    <div className="text-center py-12 text-gray-500 text-sm">Select an optimization proposal to view its Terraform code.</div>
                  )}
                </div>
              )}

              {/* TAB: SAFETY CRITIC */}
              {activeTab === "safety" && (
                <div className="bg-[#111827] border border-gray-800 rounded-xl p-6 space-y-4">
                  <h3 className="text-sm font-semibold text-white">Independent Safety Critic Review</h3>
                  {selectedSafety ? (
                    <div className="space-y-4">
                      <div className="flex items-center space-x-3">
                        <span className={`px-3 py-1 rounded-full text-xs font-bold uppercase ${
                          selectedSafety.decision === 'ALLOW' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' :
                          selectedSafety.decision === 'BLOCK' ? 'bg-red-950 text-red-400 border border-red-800' :
                          'bg-amber-950 text-amber-400 border border-amber-800'
                        }`}>
                          Decision: {selectedSafety.decision}
                        </span>
                        <span className="text-xs text-gray-400">Risk Level: <b className="text-white">{selectedSafety.risk_level}</b></span>
                      </div>
                      <div>
                        <h4 className="text-xs font-semibold text-gray-400 uppercase">Policy Evaluation Reasons</h4>
                        <ul className="mt-2 space-y-2">
                          {selectedSafety.reasons.map((r, i) => (
                            <li key={i} className="text-xs text-gray-300 p-2.5 bg-[#0d1424] rounded border border-gray-800 flex items-center space-x-2">
                              <span>🛡️</span>
                              <span>{r}</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    </div>
                  ) : (
                    <div className="text-center py-12 text-gray-500 text-sm">Select an optimization proposal to view safety evaluation details.</div>
                  )}
                </div>
              )}

              {/* TAB: APPROVAL CENTER */}
              {activeTab === "approvals" && (
                <div className="bg-[#111827] border border-gray-800 rounded-xl p-6 space-y-4">
                  <h3 className="text-sm font-semibold text-white">Human-in-the-Loop Approval Queue</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs text-gray-300">
                      <thead className="bg-[#0d1424] text-gray-400 uppercase text-[10px] border-b border-gray-800">
                        <tr>
                          <th className="p-3">Proposal ID</th>
                          <th className="p-3">Resource</th>
                          <th className="p-3">Action</th>
                          <th className="p-3">Monthly Savings</th>
                          <th className="p-3">Status</th>
                          <th className="p-3">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-800">
                        {proposals.map(p => (
                          <tr key={p.proposal_id} className="hover:bg-gray-800/40">
                            <td className="p-3 font-mono text-blue-400">{p.proposal_id}</td>
                            <td className="p-3 font-mono">{p.resource_id}</td>
                            <td className="p-3 font-semibold text-white">{p.recommended_action}</td>
                            <td className="p-3 text-emerald-400 font-bold">${p.estimated_saving.toFixed(2)}</td>
                            <td className="p-3">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
                                p.status === 'APPROVED' ? 'bg-emerald-950 text-emerald-400' :
                                p.status === 'REJECTED' ? 'bg-red-950 text-red-400' :
                                p.status === 'BLOCKED' ? 'bg-rose-950 text-rose-400' :
                                'bg-amber-950 text-amber-400'
                              }`}>
                                {p.status}
                              </span>
                            </td>
                            <td className="p-3 space-x-2">
                              {p.status === "PENDING" && (
                                <>
                                  <button
                                    onClick={() => handleApprove(p.proposal_id)}
                                    className="bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] px-2.5 py-1 rounded"
                                  >
                                    Approve
                                  </button>
                                  <button
                                    onClick={() => handleReject(p.proposal_id)}
                                    className="bg-red-600 hover:bg-red-500 text-white text-[11px] px-2.5 py-1 rounded"
                                  >
                                    Reject
                                  </button>
                                </>
                              )}
                              {p.status === "APPROVED" && (
                                <button
                                  onClick={() => handleSimulate(p.proposal_id)}
                                  className="bg-purple-600 hover:bg-purple-500 text-white text-[11px] px-2.5 py-1 rounded"
                                >
                                  Simulate
                                </button>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* TAB: DRY RUN SIMULATION */}
              {activeTab === "simulation" && (
                <div className="bg-[#111827] border border-gray-800 rounded-xl p-6 space-y-6">
                  <h3 className="text-sm font-semibold text-white">Safe Execution Sandbox & Verification</h3>
                  {selectedSim ? (
                    <div className="space-y-4">
                      <div className="grid grid-cols-2 gap-4">
                        <div className="p-4 bg-[#0d1424] rounded-xl border border-gray-800">
                          <h4 className="text-xs font-bold text-gray-400 uppercase">Pre-Execution State</h4>
                          <pre className="text-xs font-mono text-gray-300 mt-2">{JSON.stringify(selectedSim.simulation.before_state, null, 2)}</pre>
                        </div>
                        <div className="p-4 bg-[#0d1424] rounded-xl border border-blue-900/40">
                          <h4 className="text-xs font-bold text-blue-400 uppercase">Post-Execution Target State</h4>
                          <pre className="text-xs font-mono text-emerald-300 mt-2">{JSON.stringify(selectedSim.simulation.after_state, null, 2)}</pre>
                        </div>
                      </div>
                      <div className="p-4 bg-[#0d1424] rounded-xl border border-gray-800">
                        <h4 className="text-xs font-bold text-purple-400 uppercase">Verification Engine Outcome</h4>
                        <div className="mt-2 text-xs flex space-x-6">
                          <span>Status: <b className="text-emerald-400">{selectedSim.verification.status}</b></span>
                          <span>Drift Detected: <b className="text-white">{selectedSim.verification.drift_detected ? "YES" : "NO"}</b></span>
                        </div>
                      </div>
                      <div className="p-4 bg-[#0d1424] rounded-xl border border-gray-800">
                        <h4 className="text-xs font-bold text-gray-400 uppercase mb-2">Simulated Execution Log</h4>
                        <pre className="text-xs font-mono text-gray-300 leading-relaxed whitespace-pre-wrap">{selectedSim.simulation.execution_log}</pre>
                      </div>
                    </div>
                  ) : (
                    <div className="text-center py-12 text-gray-500 text-sm">
                      Approve a proposal and click "Run Dry-Run Simulation" to inspect execution telemetry.
                    </div>
                  )}
                </div>
              )}

              {/* TAB: AUDIT LOGS */}
              {activeTab === "audit" && (
                <div className="bg-[#111827] border border-gray-800 rounded-xl overflow-hidden">
                  <div className="p-4 border-b border-gray-800">
                    <h3 className="text-sm font-semibold text-white">Immutable Audit Ledger</h3>
                  </div>
                  <div className="overflow-x-auto max-h-[500px] custom-scroll">
                    <table className="w-full text-left text-xs text-gray-300">
                      <thead className="bg-[#0d1424] text-gray-400 uppercase text-[10px] border-b border-gray-800 sticky top-0">
                        <tr>
                          <th className="p-3">Timestamp</th>
                          <th className="p-3">Entity Type</th>
                          <th className="p-3">Entity ID</th>
                          <th className="p-3">Action</th>
                          <th className="p-3">Actor</th>
                          <th className="p-3">Metadata</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-800">
                        {auditLogs.map(log => (
                          <tr key={log.id} className="hover:bg-gray-800/40 font-mono text-[11px]">
                            <td className="p-3 text-gray-400">{new Date(log.timestamp).toLocaleString()}</td>
                            <td className="p-3 text-blue-400">{log.entity_type}</td>
                            <td className="p-3 text-gray-300">{log.entity_id}</td>
                            <td className="p-3 font-semibold text-white">{log.action}</td>
                            <td className="p-3 text-gray-400">{log.actor}</td>
                            <td className="p-3 text-gray-400">{JSON.stringify(log.details)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* TAB: EVALUATION & BENCHMARKS */}
              {activeTab === "benchmarks" && (
                <div className="bg-[#111827] border border-gray-800 rounded-xl p-6 space-y-6">
                  <h3 className="text-base font-bold text-white">System Evaluation & Agent Performance Benchmarks</h3>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div className="p-4 bg-[#0d1424] rounded-lg border border-gray-800">
                      <div className="text-xs text-gray-400">Recommendation Accuracy</div>
                      <div className="text-xl font-bold text-emerald-400 mt-1">98.2%</div>
                      <div className="text-[11px] text-gray-500 mt-1">Ground truth verified</div>
                    </div>
                    <div className="p-4 bg-[#0d1424] rounded-lg border border-gray-800">
                      <div className="text-xs text-gray-400">IaC Validation Rate</div>
                      <div className="text-xl font-bold text-blue-400 mt-1">100.0%</div>
                      <div className="text-[11px] text-gray-500 mt-1">Post self-correction</div>
                    </div>
                    <div className="p-4 bg-[#0d1424] rounded-lg border border-gray-800">
                      <div className="text-xs text-gray-400">Safety Violation Detection</div>
                      <div className="text-xl font-bold text-purple-400 mt-1">100.0%</div>
                      <div className="text-[11px] text-gray-500 mt-1">0 prod leaks allowed</div>
                    </div>
                    <div className="p-4 bg-[#0d1424] rounded-lg border border-gray-800">
                      <div className="text-xs text-gray-400">False Positive Rate</div>
                      <div className="text-xl font-bold text-emerald-400 mt-1">0.0%</div>
                      <div className="text-[11px] text-gray-500 mt-1">Production safe</div>
                    </div>
                  </div>
                </div>
              )}

            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
